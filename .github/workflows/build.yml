name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION_PATH: src/Maui.Hybrid.YouTube.Embed.slnx
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    # The package's iOS and Mac Catalyst builds need those workloads, which do not install on Linux.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install the iOS and Mac Catalyst workloads
      run: dotnet workload install ios maccatalyst

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

    # The suite runs the real loopback server: every request goes through a socket on 127.0.0.1.
    - name: Test with coverage
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Find coverage file
      id: coverage
      shell: bash
      run: echo "file=$(find ./coverage -name 'coverage.cobertura.xml' | head -1)" >> $GITHUB_OUTPUT

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ${{ steps.coverage.outputs.file }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
